name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.23 = the minimum declared by the `go` directive in go.mod;
        # 1.26 = the release toolchain pinned by the `toolchain` directive.
        # GOTOOLCHAIN=local stops the 1.23 leg from auto-switching to the
        # pinned toolchain, so it really compiles with the declared floor.
        go-version: ['1.23', '1.26']
    env:
      GOTOOLCHAIN: local
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
    
    - name: Install dependencies
      run: |
        # Install system dependencies that devx checks for
        sudo apt-get update
        sudo apt-get install -y tmux
        pip install --user tmuxp
        # Caddy is optional for tests (integration tests skip if not available)
    
    - name: Run tests
      run: |
        go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
    
    - name: Upload coverage to Codecov
      if: matrix.go-version == '1.23'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.txt
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  test-macos:
    name: Test macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true
    
    - name: Install dependencies
      run: |
        # Install system dependencies
        brew install tmux
        # Use pipx to install tmuxp in an isolated environment. Pin the
        # interpreter: tmuxp's argparse help formatter crashes at startup
        # under Python 3.15 (AttributeError: 'NoneType' object has no
        # attribute 'reset'), which Homebrew's pipx picks up by default.
        brew install pipx python@3.14
        pipx install --python "$(brew --prefix python@3.14)/bin/python3.14" tmuxp
        tmuxp --version
    
    - name: Run tests
      run: |
        go test -v -race ./...

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true
    
    - name: Run tests
      # Failures must fail the job. Tests for Unix-only features (tmux, Gatepost
      # trust checks, Unix permission bits) skip themselves on Windows with an
      # explicit reason; everything else must pass. -race works on
      # windows-latest (the runner ships a cgo-capable toolchain).
      run: |
        go test -v -race ./...