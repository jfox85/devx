# TEMPORARY validation for the draft PR; removed before ready-for-review.
name: Windows piagent lock flake stress
on:
  pull_request:
    branches: [ main, devx-artifacts-opus55-oct9 ]
jobs:
  stress:
    name: lock ${{ matrix.label }} ${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        label: [after-fix]
        shard: [final]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23', cache: false }
      - name: stress
        shell: bash
        run: |
          if [ "${{ matrix.label }}" = before-fix ]; then
            # Same tests; contention check reverted to the pre-fix os.IsExist.
            printf '//go:build windows\n\npackage piagent\n\nimport "os"\n\nfunc lockContended(_ string, err error) bool { return os.IsExist(err) }\n\nfunc isAccessDenied(error) bool { return false }\n' > piagent/lockerr_windows.go
            rm -f piagent/lockerr_windows_test.go
            perl -0pi -e 's/func releaseDirLock\(path string, remove func\(string\) error\) \{.*?\n\}\n/func releaseDirLock(path string, remove func(string) error) { _ = remove(path) }\n/s' piagent/lock.go
            grep -n 'func releaseDirLock' piagent/lock.go
            git diff --stat
          fi
          go test -race -count=1 -v ./piagent > full.log 2>&1; echo "FULLPKG exit=$? pass=$(grep -cE -- '--- PASS' full.log) fail=$(grep -cE -- '--- FAIL' full.log) skip=$(grep -cE -- '--- SKIP' full.log)"; grep -E -- '--- (PASS|FAIL): Test(PersistentAccessDenied|OwnedRelease|ReleaseDirLock|DirLock|DeniedTracker)' full.log; grep -E -- '^--- FAIL' full.log || true
          go test -race -count=20 -v -run '^(TestDirLockSurvivesHeavyChurn|TestPersistentAccessDeniedIsNotWaitedOut|TestOwnedReleaseNeverRemovesAnotherHoldersLock)$' ./piagent > churn.log 2>&1 || true
          echo "STRESS ${{ matrix.label }} churn runs=$(grep -cE -- '^--- (PASS|FAIL): TestDirLockSurvivesHeavyChurn ' churn.log) fails=$(grep -cE -- '^--- FAIL: TestDirLockSurvivesHeavyChurn ' churn.log) accessdenied=$(grep -c 'Access is denied' churn.log)"
          go test -race -count=100 -v -run '^TestConcurrentSendsGetDistinctOrderedTasks$' ./piagent > sends.log 2>&1 || true
          echo "STRESS ${{ matrix.label }} sends runs=$(grep -cE -- '--- (PASS|FAIL): TestConcurrentSendsGetDistinctOrderedTasks ' sends.log) fails=$(grep -cE -- '--- FAIL: TestConcurrentSendsGetDistinctOrderedTasks ' sends.log) accessdenied=$(grep -c 'Access is denied' sends.log)"
          echo "--- churn failure detail"; grep -E 'lockerr_test.go:[0-9]+|panic:|test timed out' churn.log | sed -E 's/[A-Z]:\\[^ ]*//g' | cut -c1-220 | sort | uniq -c | sort -rn | head -8 || true
          echo "--- sends failure detail"; grep -E 'manager_test.go:[0-9]+|panic:|test timed out' sends.log | sed -E 's/[A-Z]:\\[^ ]*//g' | cut -c1-220 | sort | uniq -c | sort -rn | head -8 || true
